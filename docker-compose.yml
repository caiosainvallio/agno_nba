services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agno_nba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agno
      POSTGRES_PASSWORD: agno
      POSTGRES_DB: agno
    ports:
      - "5532:5432"
    volumes:
      - agno_nba_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agno -d agno"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agno_nba_pgdata:
